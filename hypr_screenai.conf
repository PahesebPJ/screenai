# ScreenAI — Configuración de Hyprland

# 1. Modo Menú Visual (Walker / Prompts predefinidos o texto)
bindd = SUPER SHIFT, S, ScreenAI (Menú), exec, /home/alan/.local/bin/screenai

# 2. Modo Voz Directo (Sin menú: captura, graba tu voz y responde al pulsar de nuevo)
bindd = SUPER SHIFT, V, ScreenAI (Voz), exec, /home/alan/.local/bin/screenai-voice
bindd = SUPER, V, ScreenAI (Voz Rápida), exec, /home/alan/.local/bin/screenai-voice
